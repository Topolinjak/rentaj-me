name: rentaj-me

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentaj}
      POSTGRES_DB: ${POSTGRES_DB:-rentaj}
      TZ: Europe/Ljubljana
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-podatki:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-podatki:
